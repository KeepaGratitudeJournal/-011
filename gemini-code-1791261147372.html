<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>五感探測器 - 暖身小練習</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: #F4F7F6;
      color: #2D3748;
      margin: 0;
      padding: 20px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 30px 22px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.07);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #E6FFFA;
      color: #234E52;
      font-size: 18px;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 30px;
      margin-bottom: 16px;
    }
    .icon {
      font-size: 64px;
      margin: 8px 0;
      animation: float 2.5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h2 {
      font-size: 28px;
      color: #2C7A7B;
      margin: 10px 0 16px 0;
    }
    .desc {
      font-size: 21px;
      line-height: 1.7;
      color: #4A5568;
      min-height: 110px;
      margin-bottom: 24px;
      text-align: justify;
      text-justify: inter-ideograph;
    }
    .btn-voice {
      background: #EDF2F7;
      color: #4A5568;
      font-size: 18px;
      font-weight: 600;
      border: 1px solid #CBD5E0;
      border-radius: 12px;
      padding: 10px 18px;
      margin-bottom: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-main {
      background: #319795;
      color: #FFFFFF;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      padding: 16px 20px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(49, 151, 149, 0.35);
    }
    .btn-main:active { background: #285E61; }
  </style>
</head>
<body>

  <div class="card" id="app">
    <div class="badge" id="step-badge">暖身步驟 1 / 5</div>
    <div class="icon" id="step-icon">👀</div>
    <h2 id="step-title">視覺探測：看一看</h2>
    <div class="desc" id="step-desc">請抬起頭環顧四周，找出 3 個平時沒特別留意的物品或顏色，靜靜地看著它 5 秒鐘。</div>

    <button class="btn-voice" onclick="speakCurrent()">🔊 聽語音說明</button>
    <button class="btn-main" onclick="nextStep()">我感覺到了，下一步 ➔</button>
  </div>

  <script>
    const steps = [
      {
        badge: "暖身步驟 1 / 5",
        icon: "👀",
        title: "視覺探測：看一看",
        desc: "請抬起頭環顧四周，找出 3 個平時沒特別留意的物品或顏色，靜靜地看著它 5 秒鐘。"
      },
      {
        badge: "暖身步驟 2 / 5",
        icon: "👂",
        title: "聽覺探測：聽一聽",
        desc: "請輕輕閉上眼睛、深呼吸，仔細聆聽現場周遭的聲音：風扇聲、腳步聲、或是窗外的微小聲音，注意 3 種平時忽略的聲音。"
      },
      {
        badge: "暖身步驟 3 / 5",
        icon: "✋",
        title: "觸覺探測：摸一摸",
        desc: "請感受雙腳踏在地面上的扎實感，並用雙手摸摸桌面、衣服或手機邊框，感受它的溫度與質地。"
      },
      {
        badge: "暖身步驟 4 / 5",
        icon: "👃",
        title: "嗅覺探測：聞一聞",
        desc: "請慢慢用鼻子深深吸一口氣。聞聞看周遭空氣的味道，或是衣物上淡淡的洗衣香、環境氣味。"
      },
      {
        badge: "暖身步驟 5 / 5",
        icon: "👅",
        title: "味覺探測：品一品",
        desc: "輕輕閉上嘴巴，動動舌頭，感受一下口腔裡現在有什麼滋味？感覺唾液的分泌與口腔的溫度。"
      }
    ];

    let current = 0;

    function renderStep() {
      const item = steps[current];
      document.getElementById('step-badge').innerText = item.badge;
      document.getElementById('step-icon').innerText = item.icon;
      document.getElementById('step-title').innerText = item.title;
      document.getElementById('step-desc').innerText = item.desc;
    }

    function speakCurrent() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const text = `${steps[current].title}。${steps[current].desc}`;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-TW';
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
      } else {
        alert("很抱歉，您的手機瀏覽器不支援自動朗讀語音。");
      }
    }

    function nextStep() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      if (current < steps.length - 1) {
        current++;
        renderStep();
      } else {
        document.getElementById('app').innerHTML = `
          <div class="icon">✨</div>
          <div class="badge">暖身完成</div>
          <h2>感官探測已啟動！</h2>
          <div class="desc" style="text-align: center;">
            太棒了！您的五種感官都已經打開、靜下心來了。<br><br>
            <b>接下來，請老師或志工發放葡萄乾，準備展開好玩的葡萄乾正念體驗！</b>
          </div>
          <button class="btn-main" onclick="location.reload()">重新暖身</button>
        `;
      }
    }
  </script>
</body>
</html>
